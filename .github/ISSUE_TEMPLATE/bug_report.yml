name: Bug Report
description: File a bug report to help us improve.
body:
  - type: markdown
    attributes:
      value: Thank you for reporting a bug. Please fill in the details below.
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      placeholder: Describe what happens and what you expected.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      placeholder: 1. Launch app\n2. Click on tab...
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating System
      placeholder: e.g. Windows 11, Ubuntu 22.04
    validations:
      required: true
